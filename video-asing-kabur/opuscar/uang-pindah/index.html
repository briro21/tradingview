<!doctype html>
<html><head><meta charset="utf-8"><title>Uang pindah tempat</title>
<style>
@font-face{font-family:'Jost';src:url('fonts/Jost.ttf') format('truetype');font-weight:100 900;}
html,body{margin:0;background:#F2E6D0;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const cv = document.getElementById('c'), g = cv.getContext('2d');
for (const w of [400, 500, 600, 700]) await document.fonts.load(`${w} 40px Jost`);
const film = await import('./film.js');
window.DUR = film.DUR;
window.render = t => { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; film.render(g, t); };
window.READY = true;
</script></body></html>
