<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Latihan Soal</title>
<meta name="description" content="Latihan soal dengan XP, streak, dan pembahasan lengkap." />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#eaf4f7;--card:#fff;--ink:#14213d;--muted:#5c6b80;--pri:#2b7a9b;--ok:#2a9d5c;--bad:#d64545;--line:#d4e3ea;--acc:#ffb703}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1a24;--card:#18273a;--ink:#e8f0f7;--muted:#9fb0c3;--line:#2a3d55;--pri:#5bb4d6}}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:820px;margin:auto}
  h1{font-family:"Bebas Neue";font-size:2.2rem;margin:0;letter-spacing:1px;color:var(--pri);cursor:pointer}
  .stats{display:flex;gap:8px}.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem}
  main{max-width:820px;margin:auto;padding:0 16px 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .paket{cursor:pointer;transition:transform .15s}.paket:hover{transform:translateY(-3px);border-color:var(--pri)}
  .paket h3{margin:0 0 6px}.muted{color:var(--muted);font-size:.9rem}
  .bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--pri)}
  .opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
  .opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
  .bahas{margin-top:12px;padding:12px;border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));border-radius:8px}
  .btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .big{font-family:"Bebas Neue";font-size:4rem;margin:0;color:var(--pri)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--acc);color:#14213d;padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:.3s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1 onclick="home()">Latihan Soal</h1>
  <div class="stats"><span class="chip" id="xp"></span><span class="chip" id="streak"></span></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="soal.js"></script>
<script>
const $ = s => document.querySelector(s), app = $("#app");
const load = () => { try { return JSON.parse(localStorage.getItem("ls-state")) || {} } catch { return {} } };
let S = Object.assign({ xp: 0, streak: 0, last: "", best: {} }, load());
const save = () => { try { localStorage.setItem("ls-state", JSON.stringify(S)) } catch {} };
const today = () => new Date().toISOString().slice(0, 10);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function stats() { $("#xp").textContent = "⭐ " + S.xp + " XP"; $("#streak").textContent = "🔥 " + S.streak + " hari"; }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1200); }
function touchStreak() {
  const t = today(); if (S.last === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  S.streak = S.last === y ? S.streak + 1 : 1; S.last = t;
}
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);

function home() {
  stats();
  app.innerHTML = `<p class="muted">Pilih paket soal untuk mulai berlatih.</p><div class="grid">${
    BANK_SOAL.map((p, i) => { const b = S.best[p.id] ?? 0; return `<div class="card paket" onclick="start(${i})">
      <h3>${esc(p.judul)}</h3><div class="muted">${esc(p.deskripsi || "")}</div>
      <div class="bar"><i style="width:${b}%"></i></div><div class="muted">${p.soal.length} soal · skor terbaik ${b}%</div></div>` }).join("")
  }</div>`;
}

let Q;
function start(i) {
  const p = BANK_SOAL[i];
  Q = { p, list: shuffle(p.soal), n: 0, benar: 0, combo: 0 };
  show();
}
function show() {
  const s = Q.list[Q.n], tot = Q.list.length;
  app.innerHTML = `<div class="card">
    <div class="row"><b>${esc(Q.p.judul)}</b><span class="muted">Soal ${Q.n + 1}/${tot}</span></div>
    <div class="bar"><i style="width:${Q.n / tot * 100}%"></i></div>
    <p style="font-size:1.1rem;font-weight:600">${esc(s.tanya)}</p>
    ${s.pilihan.map((o, k) => `<button class="opt" onclick="answer(${k})">${"ABCDE"[k]}. ${esc(o)}</button>`).join("")}
    <div id="after"></div></div>`;
}
function answer(k) {
  const s = Q.list[Q.n], btns = document.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[s.jawaban].classList.add("ok");
  if (k === s.jawaban) { Q.benar++; Q.combo++; const g = 10 + (Q.combo >= 3 ? 5 : 0); S.xp += g; toast("+" + g + " XP" + (Q.combo >= 3 ? " 🔥 combo!" : "")); }
  else { btns[k].classList.add("bad"); Q.combo = 0; }
  save(); stats();
  const last = Q.n === Q.list.length - 1;
  $("#after").innerHTML = `${s.bahas ? `<div class="bahas"><b>Pembahasan:</b> ${esc(s.bahas)}</div>` : ""}
    <div style="text-align:right;margin-top:14px"><button class="btn" onclick="next()">${last ? "Lihat Hasil" : "Lanjut →"}</button></div>`;
}
function next() { Q.n++; Q.n < Q.list.length ? show() : finish(); }
function finish() {
  const pct = Math.round(Q.benar / Q.list.length * 100);
  S.best[Q.p.id] = Math.max(S.best[Q.p.id] || 0, pct); touchStreak(); save(); stats();
  const i = BANK_SOAL.indexOf(Q.p);
  app.innerHTML = `<div class="card" style="text-align:center"><p class="muted">${esc(Q.p.judul)}</p>
    <p class="big">${pct}%</p><p>Benar ${Q.benar} dari ${Q.list.length} soal</p>
    <p>${pct >= 80 ? "Luar biasa! 🎉" : pct >= 60 ? "Bagus, terus berlatih! 💪" : "Jangan menyerah, coba lagi! 📚"}</p>
    <div class="row" style="justify-content:center"><button class="btn ghost" onclick="home()">Beranda</button><button class="btn" onclick="start(${i})">Ulangi</button></div></div>`;
}
home();
</script>
</body>
</html>
